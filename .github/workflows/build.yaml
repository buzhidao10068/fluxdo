name: Android Delivery

# 分支产生验证包；候选构建只上传产物，不创建 Release 或标签。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate:
        description: 使用维护者正式签名构建候选 APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yaml

  apk:
    name: Android arm64 APK
    needs: quality
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
      BUILD_MODE: ${{ inputs.candidate == true && 'release' || 'debug' }}
      ORG_GRADLE_PROJECT_requireReleaseSigning: ${{ inputs.candidate == true && 'true' || 'false' }}
      ORG_GRADLE_PROJECT_enableFirebase: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libssl-dev openssl
          sdkmanager "ndk;$ANDROID_NDK_VERSION" 'platforms;android-36' 'build-tools;36.0.0'
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Configure candidate signing
        if: inputs.candidate == true
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          if not all(os.environ.get(k) for k in ('KEYSTORE_BASE64', 'KEY_PROPERTIES', 'EXPECTED_CERT')):
              raise SystemExit('缺少候选签名 secrets 或 ANDROID_SIGNING_CERT_SHA256')
          store = Path(os.environ['RUNNER_TEMP']) / 'nodeloc-release.jks'
          store.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          properties = [line for line in os.environ['KEY_PROPERTIES'].splitlines()
                        if not line.lstrip().startswith('storeFile')]
          properties.append(f'storeFile={store}')
          Path('android/key.properties').write_text(chr(10).join(properties) + chr(10))
          PY

      - name: Build from source through project wrapper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/delivery
          git submodule status --recursive > build/delivery/submodules.txt
          { flutter --version; java -version; rustc --version; cargo ndk --version; } > build/delivery/toolchain.txt 2>&1
          if [ "$BUILD_MODE" = release ]; then
            dart tool/flutterw.dart build apk --release --target-platform android-arm64 --dart-define=cronetHttpNoPlay=true --split-debug-info=build/symbols 2>&1 | tee build/delivery/build.log
          else
            dart tool/flutterw.dart build apk --debug --target-platform android-arm64 --dart-define=cronetHttpNoPlay=true 2>&1 | tee build/delivery/build.log
          fi

      - name: Verify APK identity, native source, CA and signature
        env:
          EXPECTED_CERT: ${{ inputs.candidate == true && vars.ANDROID_SIGNING_CERT_SHA256 || '' }}
        run: |
          python3 scripts/ci/android/verify_apk.py --apk "build/app/outputs/flutter-apk/app-$BUILD_MODE.apk" --mode "$BUILD_MODE" --sdk "$ANDROID_HOME" --build-tools 36.0.0 --expected-cert "$EXPECTED_CERT" --output build/delivery/apk-evidence.json

      - name: Upload APK, symbols and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeloc-android-arm64-${{ env.BUILD_MODE }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/symbols/
            build/delivery/

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/nodeloc-release.jks"
