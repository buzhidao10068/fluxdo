name: Quality Gate

# 覆盖 Android 站点身份、生态清理、P1 定制层、P2 登录链路和 P4 参数文案。
# Rust 检查只覆盖主仓 gitlink 对应的源码，APK 原生产物由 Android Delivery 核验。
#
# 背景：原 build.yaml 只在 `v*` tag 触发，且全流程没有 flutter analyze /
# flutter test / cargo test 步骤。历史上多次「该改而没改」的问题因此直接
# 发版，例如：
# - 剪贴板正则丢失 raw string，转义全丢、RegExp 编译失败，剪贴板检测静默失效；
# - baseUrl 带 www 后 7 处 host 判定退化成「只认 www.」，裸域/子域被误判为外链；
# - 测试夹具仍写 linux.do，与已改的实现不一致（断言重复、用例失效）；
# - Rust 子模块的 ECH 内置域只改了 Dart 侧，改动没进仓 → ECH 对新站 100% 失效。
#
# 本 workflow 把「改完立刻验证」变成强制项，不依赖发版时机。
#
# 分级说明（阻塞 / 非阻塞）：
# - 阻塞项：本地化生成 + flutter analyze + 各迁移步骤定向测试 + cargo test。
# - 非阻塞项：全量 flutter test。
#   每次交付保存当前失败清单并判定影响，不引用历史失败数作为放行依据。
#   Android 核心链路及本次引入的回归仍须解决。

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: '3.47.4'

concurrency:
  group: ${{ github.workflow }}-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Android 迁移静态检查与定向测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # flutter test 不启动桌面插件注册器，仍需加载共用编辑器使用的真实 JS 引擎。
      - name: Expose host QuickJS for editor tests
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          config = Path('.dart_tool/package_config.json').resolve()
          package = next(p for p in json.loads(config.read_text())['packages'] if p['name'] == 'flutter_js')
          uri = urlparse(package['rootUri'])
          root = Path(unquote(uri.path)) if uri.scheme == 'file' else config.parent / unquote(package['rootUri'])
          library = (root / 'linux/shared').resolve()
          if not (library / 'libquickjs_c_bridge_plugin.so').is_file():
              raise SystemExit('flutter_js 缺少宿主 QuickJS 动态库')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"LD_LIBRARY_PATH={library}:{os.environ.get('LD_LIBRARY_PATH', '')}\n")
          PY

      # 这两组 Dart 产物被 .gitignore 排除；pub get 不会运行项目的 slang 生成器。
      # 必须在 analyze 前生成，避免本地已有产物掩盖干净检出的缺失。
      - name: Generate localizations
        run: dart tool/gen_l10n.dart

      # 门禁 1：静态检查（阻塞）。
      # 范围刻意限定为 lib/ + 各迁移步骤相关测试文件，原因：
      # - devtools_extension/ 与 packages/*/example/ 有 10 个历史 error
      #   （缺 integration_test / devtools_extensions 依赖），与主工程无关；
      # info 级既有 lint 不阻塞；error / warning 均阻塞，避免清理遗漏被放行。
      # 站点身份类改动最常见的翻车方式是「把 raw string 写成普通字符串」
      # 「host 判定口径改了一半」，analyze 能挡住其中一部分，其余由门禁 2 兜住。
      - name: flutter analyze (lib + site identity tests)
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib \
            test/services/dio_http_client_site_host_test.dart \
            test/services/deep_link_service_test.dart \
            test/services/clipboard_topic_link_service_test.dart \
            test/utils/url_helper_test.dart \
            test/platform/android_site_identity_test.dart \
            test/platform/url_scheme_registration_test.dart \
            test/config/sites/nodeloc_customization_test.dart \
            test/utils/link_security_test.dart \
            test/utils/link_launcher_test.dart \
            test/services/network/doh/dns_warmup_hosts_test.dart \
            test/services/network/doh/ech_dns_policy_test.dart \
            test/pages/network_settings/ech_settings_card_test.dart \
            test/models/profile_stats_config_test.dart \
            test/providers/profile_stats_provider_test.dart \
            test/providers/account_session_reset_test.dart \
            test/providers/user_summary_lifecycle_test.dart \
            test/providers/bookmark_name_suggestions_provider_test.dart \
            test/providers/bookmarks_notifier_pagination_test.dart \
            test/providers/bookmarks_reconciler_test.dart \
            test/providers/bookmarks_provider_test.dart \
            test/plugins/warden_user_specific_min_length_test.dart \
            test/widgets/nodeloc_ecosystem_test.dart \
            test/widgets/markdown_editor/media_upload_helper_test.dart \
            test/services/nodeloc_media_upload_test.dart \
            test/services/media_compressor_test.dart \
            test/services/media_compat_service_test.dart \
            test/services/nodeloc_composer_min_length_test.dart \
            test/services/ai_post_review_service_test.dart \
            test/pages/parallel_pages_test.dart \
            test/platform/nodeloc_application_identity_test.dart \
            test/services/app_data_isolation_test.dart \
            test/services/per_device_cert_service_test.dart \
            test/services/device_ca_rotation_test.dart \
            test/services/doh_proxy_ca_lifecycle_test.dart \
            test/services/ffi_worker_test.dart \
            test/services/network/adapters/network_http_adapter_ca_test.dart \
            test/services/storage/system_secret_store_test.dart \
            test/services/data_backup_service_test.dart \
            test/services/discourse_login_test.dart \
            test/widgets/auth/nodeloc_login_test.dart \
            test/widgets/auth/webview_login_page_test.dart \
            test/support/cf_test_platform.dart \
            test/services/network/cookie/app_cookie_manager_test.dart \
            test/services/network/cookie/boundary_sync_clearance_test.dart \
            test/services/network/webview/webview_adapter_settings_service_test.dart \
            packages/enhanced_cookie_jar/lib \
            packages/enhanced_cookie_jar/test

      # 门禁 2：站点身份定向测试（阻塞）。
      # 覆盖 baseUrl/siteHost/siteRootDomain/isSiteHost 派生、深链 host 白名单、
      # 剪贴板域名识别、可信图片域名、Android Manifest 的 host/path/scheme
      # 以及 app_links 路由配置。系统域名验证仍需站方 assetlinks.json。
      # 这些用例刻意包含裸域 / 子域 / 恶意域（evilnodeloc.com 等），
      # 正是历史上反复回归的那几条。
      - name: flutter test (site identity)
        run: |
          flutter test --no-pub \
            test/services/dio_http_client_site_host_test.dart \
            test/services/deep_link_service_test.dart \
            test/services/clipboard_topic_link_service_test.dart \
            test/utils/url_helper_test.dart \
            test/platform/android_site_identity_test.dart \
            test/platform/url_scheme_registration_test.dart \
            test/services/network/doh/ech_dns_policy_test.dart \
            test/services/network/webview/webview_adapter_settings_service_test.dart

      # 第 2 步 P3：旧配置迁移、移除生态入口与保留标准论坛功能。
      - name: flutter test (ecosystem removal)
        run: |
          flutter test --no-pub \
            test/models/profile_stats_config_test.dart \
            test/providers/profile_stats_provider_test.dart \
            test/providers/account_session_reset_test.dart \
            test/providers/user_summary_lifecycle_test.dart \
            test/providers/bookmark_name_suggestions_provider_test.dart \
            test/providers/bookmarks_notifier_pagination_test.dart \
            test/providers/bookmarks_reconciler_test.dart \
            test/providers/bookmarks_provider_test.dart \
            test/widgets/nodeloc_ecosystem_test.dart \
            test/services/data_backup_service_test.dart \
            test/services/network/cookie/app_cookie_manager_test.dart \
            test/services/network/cookie/boundary_sync_clearance_test.dart \
            test/widgets/post/post_device_source_test.dart \
            test/plugins/reply_cost_plugin_test.dart \
            test/plugins/warden_plugin_test.dart \
            test/plugins/warden_user_specific_min_length_test.dart

      # 第 3 步 P1：站点样式与插件隔离、外链分类与实际点击、DNS 预热和 ECH 设置。
      - name: flutter test (site customization)
        run: |
          flutter test --no-pub \
            test/config/sites/nodeloc_customization_test.dart \
            test/utils/link_security_test.dart \
            test/utils/link_launcher_test.dart \
            test/services/network/doh/dns_warmup_hosts_test.dart \
            test/pages/network_settings/ech_settings_card_test.dart

      # 第 4 步 P2：验证码配置、会话凭据、2FA 交接、取消写入与真实 CF 挑战兜底。
      - name: flutter test (NodeLoc login)
        run: |
          flutter test --no-pub \
            test/services/discourse_login_test.dart \
            test/widgets/auth/nodeloc_login_test.dart \
            test/widgets/auth/webview_login_page_test.dart \
            test/services/login_ready_coordinator_test.dart \
            test/services/network/csrf_main_chain_test.dart \
            test/services/qr_login_service_test.dart \
            test/services/cf_challenge_guards_test.dart \
            test/services/network/interceptors/cf_challenge_interceptor_test.dart \
            packages/enhanced_cookie_jar/test

      # 第 5 步 P4：动态限额、原扩展名上传、旧媒体播放、分场景字数与独立应用身份。
      - name: flutter test (NodeLoc parameters and branding)
        run: |
          flutter test --no-pub \
            test/widgets/markdown_editor/media_upload_helper_test.dart \
            test/services/nodeloc_media_upload_test.dart \
            test/services/media_compressor_test.dart \
            test/services/media_compat_service_test.dart \
            test/services/nodeloc_composer_min_length_test.dart \
            test/services/ai_post_review_service_test.dart \
            test/pages/parallel_pages_test.dart \
            test/services/app_data_isolation_test.dart \
            test/services/per_device_cert_service_test.dart \
            test/services/device_ca_rotation_test.dart \
            test/services/doh_proxy_ca_lifecycle_test.dart \
            test/services/ffi_worker_test.dart \
            test/services/network/adapters/network_http_adapter_ca_test.dart \
            test/services/storage/system_secret_store_test.dart \
            test/platform/nodeloc_application_identity_test.dart

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node test (polyfill banner)
        run: node --test tools/polyfill-bundle/test/banner.test.mjs

      # 全量测试：非阻塞，仅记录基线漂移（见文件头说明）。
      - name: flutter test (full, non-blocking)
        continue-on-error: true
        run: |
          mkdir -p build/quality
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee build/quality/full-test.log

      - name: Upload full test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-full-test-${{ github.job }}-${{ github.run_attempt }}
          path: build/quality/

  rust:
    name: Rust (doh_proxy) 单元测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev

      # 保留已有检查。本 job 只验证主仓指针指向的源码；Android Delivery 另行核验 APK。
      - name: cargo test (ech)
        working-directory: core/doh_proxy
        run: cargo test --locked --features ech --lib

      - name: cargo test (default)
        working-directory: core/doh_proxy
        run: cargo test --locked --lib
